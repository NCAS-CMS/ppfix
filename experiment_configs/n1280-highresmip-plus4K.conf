[General]
activity_id = HRCM
mip_era = CMIP6
mip = HighRESMIP
experiment = highresSST-p4K
creators = Torsten Auerswald, Jeff Cole, Grenville Lister, Andrew Mirza, Annette Osprey
investigators = Pier-Luigi Vidale, Bryan Lawrence
description = "This simulation conforms to HighRESMIP, but was not part of the project.
It forms part of a perturbed physics ensemble, where members were all initialised from
a point one year into u-cf432, which itself follows one year of u-cd936. Further details
of this ensemble can be found on the HRCM pages at the further_info_url.
"  
contact = cms-support@ncas.ac.uk
institution = NCAS
further_info_url = https://github.com/ncas-cms/model_output/HRCM/N1280-E1

[simulations]
ensemble = {
      'u-de433':'r1i1p1f1',
}

[run_specific]
runid = '*${RUNID}*'


[model_general]
model_family = HadGAM3
source_id = HadGA3-N1280
model_identifier = NCAS-CMS/GL/1
source = "HadGA3-N1280 (2022):
      =aerosol: Easy Aerosol
      =atmos: GA7.2.1-EA (N1280; 2560 x 1920 longitude/latitude; 85 levels; top level 85 km)
      =atmosChem: none
      =land: GL7
      =landIce: none
      =ocean: none
      =ocnBgchem: none
      =seaIce: none
      "
grid_label = gn
source_known_as = HadGA3-N1280

[model_atmos]
grid='Native N1280 grid; 2560 x 1920 longitude/latitude'
nominal_resolution='10 km'

# These are not output metadata properties, but are used to control the details of the output files.
# These are good defaults and you probably shouldn't change them unless you know what you are doing.
# Note that dataset chunk sizes will be ignored if there is an explicit chunking scheme defined in the processing.
[output]
compress=1
single=True
dataset_chunks=4 MiB
