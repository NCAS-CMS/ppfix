[General]
activity-id = HRCM
experiment = spinup
creators = Annette Osprey, Grenville Lister, Jeff Cole, Bryan Lawrence
investigators = Pier-Luigi Vidale, Malcolm Roberts, Bryan Lawrence
description = "UKCM2a-UH. Initialised from 1950 initial conditions 
               from UKCM2a-HH N640-O12 historical r1i1p1f1 and run with fixed 1950 forcings, 
               equivalent to the spinup-1950 experiment from CMIP6 HighResMIP."
contact = cms-support@ncas.ac.uk
institution = NCAS
further_info_url = https://github.com/ncas-cms/model_output/2026

[run_specific]
#runid = '*${RUNID}*'
runid = udz876
u-dz876 = r1i1f1p1

[model_general]
model_family = UKCM2
source_id = UKCM2a-UH
model_identifier = NCAS-CMS/AO/1
source = "UKCM2a (2026):
      =aerosol: UKCA-GLOMAP-mode
      =atmos: GA9a (N1280; 2560 x 1920 longitude/latitude; 85 levels; top level 85 km)
      =atmosChem: none
      =land: GL9
      =landIce: none
      =ocean: NEMO-GOSI9 (ORCA12 tripolar primarily 1/12 deg; 4320 x 2160 longitude/latitude; 75 levels; top grid cell 0-1 m)
      =ocnBgchem: none
      =seaIce: SI3-GOSI9 (ORCA12 tripolar primarily 1/12 deg; 4320 x 2160 longitude/latitude)'
      "
grid_label = gn
mip_era = CMIP7
source_known_as = N1280O12

[model_ocean]
grid='Native ORCA12 tripolar primarily 1/12 deg grid; 4320 x 2160 longitude/latitude'
nominal_resolution='10 km'

[model_atmos]
grid='Native N1280 grid; 2560 x 1920 longitude/latitude'
nominal_resolution='10 km'

[model_seaice]
grid='Native ORCA12 tripolar primarily 1/12 deg grid; 4320 x 2160 longitude/latitude'
nominal_resolution='10 km'

# These are not output metadata properties, but are used to control the details of the output files.
# These are good defaults and you probably shouldn't change them unless you know what you are doing.
# Note that dataset chunk sizes will be ignored if there is an explicit chunking scheme defined in the processing.
[output]
compression=1
single=True
dataset_chunks="4 MiB"
