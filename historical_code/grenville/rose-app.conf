[command]
default=modify_netcdf.py

[mod_netcdf]
add_global_metadata=false
fix_grid_metadata=false
mod_cell_methods=true
netcdf_dir='$ROSE_DATAC'

[model_metadata(all)]
activity_id='EPOC'
branch_method='micro initialisation from CMIP6 macro parent'
