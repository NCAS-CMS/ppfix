[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppfix"
version = "0.1.0"
description = "Post-processing utilities for rechunking and rewriting UM, NEMO, and related model output."
requires-python = ">=3.11"
dependencies = [
    "cf-python",
    "numpy>=1.24",
    "pyfive>=1.1.2",
]

[tool.setuptools.packages.find]
include = ["ppfix*", "tables*"]

[tool.setuptools.package-data]
tables = ["*.json", "*.csv"]